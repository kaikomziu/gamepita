<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 読み込み元を制限（XSS 対策）。外部はかるわかGAMESアカウント・Supabase・画像(https)・YouTube だけ -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://kaikomziu.github.io; style-src 'self' 'unsafe-inline'; img-src 'self' https: data:; connect-src https://kifnzvktwbomxthzvvgy.supabase.co; frame-src https://www.youtube-nocookie.com; base-uri 'none'; form-action 'self'; manifest-src 'self'">
<meta name="referrer" content="strict-origin-when-cross-origin">
{{HEAD}}
<meta property="og:site_name" content="GamePita">
<meta property="og:locale" content="ja_JP">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#ff4f6b">
<script src="{{BASE}}theme.js?v={{VER}}"></script>
<link rel="icon" href="{{BASE}}icon.svg?v={{VER}}" type="image/svg+xml">
<link rel="stylesheet" href="{{BASE}}style.css?v={{VER}}">
<script src="https://kaikomziu.github.io/game-links/js/karuwaka-account.js" data-game="gamepita" data-keys="" data-badge="off"></script>
</head>
<body>
<header class="top">
  <div class="top-in">
    <a class="logo" href="{{BASE}}" aria-label="GamePita トップへ">
      <img src="{{BASE}}icon.svg?v={{VER}}" alt="" width="34" height="34">
      <span class="logo-text">Game<b>Pita</b></span>
    </a>
    <nav class="nav">
      <a href="{{BASE}}blog/" class="nav-link" aria-label="ブログ">📚<span class="lbl2"> ブログ</span></a>
      <a href="{{BASE}}shindan/" class="nav-link nav-hide-sm">🧩 ピタっと診断</a>
      <a href="{{BASE}}new/" class="btn btn-primary btn-sm" id="newBtn" aria-label="記事を書く">✏️<span class="lbl"> 記事を書く</span></a>
      <button class="icon-btn hidden" id="bellBtn" type="button" aria-label="通知">🔔<span class="bell-n hidden" id="bellN"></span></button>
      <button class="icon-btn" id="themeBtn" type="button" aria-label="ダークモード切りかえ">🌙</button>
      <button class="user-btn" id="userBtn" type="button" aria-label="アカウント">
        <span id="userAvatar">👤</span><span id="userName" class="user-name">ログイン</span>
      </button>
    </nav>
  </div>
</header>

<main id="app" class="wrap" aria-live="polite">
{{MAIN}}
</main>

<footer class="foot">
  <p><b>GamePita</b> ― 自分に合うゲームを、ピタっと見つける。</p>
  <p class="foot-links"><a href="{{BASE}}">トップ</a> ・ <a href="{{BASE}}blog/">ブログ</a> ・ <a href="{{BASE}}shindan/">ピタっと診断</a> ・ <a href="{{BASE}}shindan/type/">診断タイプ一覧</a> ・ <a href="{{BASE}}rules/">投稿のルール</a></p>
  <p class="small">記事は利用者が書いたものです。問題のある記事は「通報」からお知らせください。
    画像・動画は外部サイトのものを表示しています。</p>
  <p class="small">ログイン: かるわかGAMESアカウント ／ <span class="ver">v{{VER}}</span></p>
</footer>

<div id="modal" class="modal hidden" role="dialog" aria-modal="true">
  <div class="modal-box" id="modalBox"></div>
</div>
<div id="toast" class="toast hidden" role="status"></div>

<script src="{{BASE}}render.js?v={{VER}}"></script>
<script src="{{BASE}}app.js?v={{VER}}" data-base="{{BASE}}" data-site="{{SITE}}"></script>
</body>
</html>
