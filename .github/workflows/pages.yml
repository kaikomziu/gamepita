# 静的ページ（記事・一覧・サイトマップ）を作って GitHub Pages に公開する
# push したとき・1時間ごと・手動で動く。記事の取得に失敗したら公開しない（前の版が残る）
name: Build and deploy
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/build.mjs
        env:
          BASE: /gamepita/
          SITE: https://kaikomziu.github.io/gamepita/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
